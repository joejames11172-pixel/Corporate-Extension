<!doctype html><html><head><meta charset="utf-8"><title>Peostectica SRP</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Peostectica</h1><p>SRP browser diagnostics · prototype</p>
<label>Bridge HTTPS address<input id="url" placeholder="https://bridge.example:8766" autocomplete="off"></label>
<label>Pairing identity<input id="identity" autocomplete="off"></label>
<label>Pairing password<input id="password" type="password" autocomplete="off"></label>
<button id="pair">Pair securely</button><hr>
<button id="allow">Enable reading of this tab</button><button id="disconnect">Disconnect and clear enabled tabs</button>
<p id="status" role="status">Disconnected</p><p class="note">This prototype only reads enabled tabs. Passwords and input values are excluded. Key and login pages are blocked. Pairing expires after one hour.</p>
<script src="popup.js"></script></body></html>
